name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    name: test + conformance (${{ matrix.os }})
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go vet ./...
      - run: go build ./...
      - name: test + conformance ratchet
        shell: bash
        run: |
          # -timeout, because the default is 10 minutes and windows-latest needs more
          # than that: the suite runs in ~40s locally with -race and over 600s on that
          # runner, which failed PRs at random with "panic: test timed out after 10m0s"
          # in whatever test happened to be running. No single test dominates (the
          # slowest is 7s, an expansion-limit guard) — the lane is simply that slow, so
          # the bound is raised rather than the suite trimmed. A real deadlock still
          # fails, three times later.
          go test -timeout 30m -race -coverprofile=cover.out ./...
          pct=$(go tool cover -func=cover.out | tail -1 | grep -oE '[0-9.]+' | tail -1)
          echo "coverage ${pct}% (in-progress engine; primary gate is the conformance ratchet in TestConformance)"
          awk "BEGIN{exit !(${pct} >= 80.0)}" || { echo "coverage ${pct}% below 80% floor"; exit 1; }
  arch:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # loong64 omitted: qemu user-mode support for it is unreliable on the runner
        # (the engine still cross-compiles for loong64; only the qemu run is dropped).
        goarch: [riscv64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      # Bounded on purpose. On 2026-08-19 this step sat on an unreachable Ubuntu
      # mirror for over an hour, in several repositories at once, and the lane
      # reported "in progress" the whole time — a hung lane is indistinguishable
      # from a slow one, and the default job timeout is six hours. These lanes
      # normally finish in one to four minutes; ten turns an apt outage into a
      # failure that can be read and re-run.
      - name: install qemu-user-static
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: test under qemu
        run: |
          arch="${{ matrix.goarch }}"
          # Go's GOARCH names mostly match qemu's user binary names; loong64 does not.
          q="qemu-${arch}-static"
          [ "$arch" = loong64 ] && q="qemu-loongarch64-static"
          if ! command -v "$q" >/dev/null 2>&1; then
            echo "::warning::$q not available on this runner; skipping $arch"
            exit 0
          fi
          GOARCH="$arch" go test -exec="$q" ./...
  wasm:
    name: wasm (${{ matrix.goos }}/wasm)
    runs-on: ubuntu-latest
    strategy: { matrix: { goos: [js, wasip1] } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: GOOS=${{ matrix.goos }} GOARCH=wasm go build ./...
  fidelity:
    name: fidelity vs real LaTeX (tectonic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: install tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo install -m 0755 tectonic /usr/local/bin/tectonic
          tectonic --version
      - name: fidelity gate (gotex reproduces real LaTeX's prose)
        run: GOWORK=off ./scripts/fidelity.sh --check
