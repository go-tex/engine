name: ci
# ⛔⛔ ONE RUN PER COMMIT. `on: [push, pull_request]` fired BOTH events for every
# push to a branch with an open pull request, so every commit ran this whole
# matrix TWICE and queued TWO macos-latest jobs against the same scarce pool.
#
# MEASURED, two independent occurrences on 2026-11-17 (#828 and #827):
#
#   job "test + conformance (macos-latest)"   runner_name=""   steps=0
#   #828 push  created 20:35:52  started 20:35:52  completed 20:50:53  = 15m01s
#   #827 pr    created 20:21:09  started 20:21:09  completed 20:36:10  = 15m01s
#
# `started_at` EQUAL to `created_at`, no runner ever assigned, zero steps, and
# both killed at the same 15m01s: that is a QUEUE limit, not a flake and not a
# test. It is also not a concurrency group (this file had none) and not a job
# timeout (none is set here, and the default is 360m).
#
# ⛔ AND IT READS AS A DEFECT IN THE DIFF. A cancelled job makes the RUN
# `failure` while containing nothing red — a job with zero steps has no red step
# to find — so the pull request reports FAIL and a reader audits a change that
# was never implicated. Worse, WHICH event survived was pure queue luck: #824
# was green on push and red on pull_request, #828 the exact mirror, same commit
# both times. A verdict that depends on which event you read is not about the
# code.
#
# So branch pushes are left to the `pull_request` event, which is the one
# `prwait` and `ghmerge` judge. This halves the demand for every runner, not
# only macos.
#
# ⚠ WHAT IS GIVEN UP, NAMED: a branch with NO open pull request is no longer
# tested on push. That is deliberate — nothing reads those runs; a branch is
# judged when it asks to be merged — but it does mean "I pushed and CI was
# green" stops being available before opening the pull request.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions: { contents: read }
jobs:
  test:
    name: test + conformance (${{ matrix.os }})
    strategy:
      # ⛔ THE RACE DETECTOR RUNS ON TWO PLATFORMS AND NOT ON THE THIRD, and the
      # policy is declared here rather than branched on inside the step, so that
      # reading the matrix tells you which lane guarantees what.
      #
      # MEASURED (go-tex/engine#799): -race costs 6.65x on this suite. Quiet
      # machine, GOMAXPROCS=1 -parallel 1 -count=1, arms interleaved AND the order
      # reversed so a drift during the pass shows as a disagreement between
      # orders rather than as an effect:
      #
      #   plain  17.486 s / 18.175 s      -race  116.361 s / 121.046 s
      #   A1->B1 6.65x                    B2->A2 6.66x      (agree to 0.2%)
      #
      # windows-latest was failing at 1800.5 s against its own 1800 s bound — one
      # push run in four, which left `main` itself red a quarter of the time and
      # made "is main green?" unanswerable. At 6.65x the lane was not 10% away
      # from comfortable, it was most of an order of magnitude away, so raising
      # the bound a third time (#156, #653 were the first two) would have bought
      # another few months and the same recurrence.
      #
      # ⚠ WHAT IS GIVEN UP, NAMED: a data race reachable ONLY through
      # Windows-specific code. A race is a property of the Go program and Go's
      # memory model is platform-independent, so everything else is still caught
      # on ubuntu and macos, on every push and every pull request. The conformance
      # ratchet and the coverage floor still run on windows — platform BEHAVIOUR
      # is still covered; only the detector is dropped.
      #
      # ⚠ The 30m bound stays for now although ~270 s is expected: the first green
      # run on this lane is what measures the new time, and changing two things at
      # once would leave nobody able to say which did it.
      matrix:
        include:
          - { os: ubuntu-latest, race: '-race' }
          - { os: macos-latest, race: '-race' }
          - { os: windows-latest, race: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go vet ./...
      # ⛔ gofmt was not gated, and two files reached main unformatted: a trailing
      # comment duplicated onto a line it did not belong to, and doc-comment list
      # items that Go 1.27's gofmt separates with a blank //. Neither is visible to
      # `go vet`, and a local gofmt only sees them once the local toolchain has moved
      # — which is why "it is clean here" is not an answer. Reported as a diff so the
      # fix is in the log rather than only the failure.
      # ⛔ shell AND lane, both deliberate. A `run:` block's default shell is pwsh on
      # windows-latest, where this bash `if [ -n … ]` is a ParserError — the first
      # version of this gate failed on Windows alone and passed on the other two.
      # And formatting does not depend on the platform, so one lane is the right
      # number: three would be the same answer three times.
      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::these files are not gofmt'd:"; gofmt -l .
            gofmt -d .
            exit 1
          fi
      - run: go build ./...
      # ⛔ WITHOUT THIS STEP TEN ASSERTIONS SKIP, which is the defect #783
      # recorded: eight TikZ and two beamer tests read a texmf tree, nothing in
      # this workflow ever provided one, and every runner skipped them while the
      # package still printed ok. They now take the tree from go-tex/texmf's
      # cache, which this step fills by compiling two documents that name the
      # bundles — the CLI's own code path, so the fetch is exercised rather than
      # imitated.
      #
      # The network lives HERE, in a step with a name, and never inside an
      # assertion. And `gotex` reports a bundle it could not fetch and carries on
      # with its own emulation, exiting 0 — right for a user, useless as a gate —
      # so the tests assert the cache themselves: texmftree_test.go FAILS instead
      # of skipping when CI is set. A silent miss here lands as a red test, not
      # as ten quiet skips.
      # ⛔ THE DOCUMENTS ONLY NAME THE PACKAGES, and -lenient is not laziness.
      # What fills the cache is the \usepackage scan that runs BEFORE the compile
      # (cmd/gotex/texmf.go), so the fetch is all this step needs. Making the
      # documents actually USE the packages couples a cache-warming step to this
      # engine's completeness, and measured here it fails for reasons that have
      # nothing to do with fetching: `\tikz` is undefined without GOTEX_PGF, and
      # the real beamer.cls wants `\leaders`, which this engine does not have.
      - name: warm the texmf cache (pgf, beamer) so the rendering tests RUN
        shell: bash
        run: |
          mkdir -p .texmfwarm
          printf '%s\n' '\documentclass{article}' '\usepackage{tikz}' \
            '\begin{document}warm\end{document}' > .texmfwarm/pgf.tex
          printf '%s\n' '\documentclass{beamer}' \
            '\begin{document}\begin{frame}warm\end{frame}\end{document}' > .texmfwarm/beamer.tex
          go run ./cmd/gotex -lenient .texmfwarm/pgf.tex
          go run ./cmd/gotex -lenient .texmfwarm/beamer.tex
          rm -rf .texmfwarm pgf.pdf beamer.pdf
          # Says, to the tests in THIS job only, that the tree is expected. The
          # arch and wasm jobs do not warm the cache and must keep skipping;
          # keying the tests on CI instead failed thirty of them in lanes that
          # were never meant to have a tree.
          echo "GOTEX_TEXMF_WARMED=1" >> "$GITHUB_ENV"
      - name: test + conformance ratchet
        shell: bash
        run: |
          # -timeout, because the default is 10 minutes and windows-latest needed
          # more than that. It then needed more than 30 either, failing at 1800.5 s
          # one run in four — see the matrix above for why the answer was to stop
          # paying 6.65x for the race detector on that lane rather than to raise
          # the bound a third time.
          #
          # ⚠ The test the panic names is INNOCENT. Go names whatever happened to
          # be running when the alarm fired — "TestTransformErrorBranches (4s)",
          # four seconds into its own run — and a reader who starts there audits
          # the wrong thing. What it was DOING is in the goroutine dump.
          #
          # ⛔⛔ AND ON 2026-11-17 UBUNTU CROSSED IT TOO, on main and not only on a
          # branch: run 44108150777 (the merge of #819) and run 44109218291 (#821)
          # both ended `panic: test timed out after 30m0s` / `FAIL … 1800.2s`.
          # Nothing was hung — the panic names ONE test, one second into its own
          # run, and the dump shows ordinary scanning — the suite simply no longer
          # fits. The lane was measured at 1229 s on 2026-11-17 12:50 (#812), so it
          # has 46% less headroom than that figure suggests.
          #
          # ⚠ 45m IS A STOPGAP AND THE ATTRIBUTION IS OPEN. The only change between
          # the 1229 s green and these two reds is #819, which touches page
          # assembly for every page, and I have NOT measured its cost: this machine
          # was at 1-min load 11.16 and a time taken there is not a measurement
          # (#799 was published at 12.7% from exactly that mistake). If #819 proves
          # to carry the 46%, the answer is to fix #819 and lower this again, not to
          # keep it. #812 holds the thread.
          #
          # ${{ matrix.race }} is '-race' on ubuntu and macos, empty on windows.
          go test -timeout 45m ${{ matrix.race }} -coverprofile=cover.out ./...
          pct=$(go tool cover -func=cover.out | tail -1 | grep -oE '[0-9.]+' | tail -1)
          echo "coverage ${pct}% (in-progress engine; primary gate is the conformance ratchet in TestConformance)"
          awk "BEGIN{exit !(${pct} >= 80.0)}" || { echo "coverage ${pct}% below 80% floor"; exit 1; }
  arch:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # loong64 omitted: qemu user-mode support for it is unreliable on the runner
        # (the engine still cross-compiles for loong64; only the qemu run is dropped).
        goarch: [riscv64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      # Bounded on purpose. On 2026-08-19 this step sat on an unreachable Ubuntu
      # mirror for over an hour, in several repositories at once, and the lane
      # reported "in progress" the whole time — a hung lane is indistinguishable
      # from a slow one, and the default job timeout is six hours. These lanes
      # normally finish in one to four minutes; ten turns an apt outage into a
      # failure that can be read and re-run.
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, and apt refuses to
      # choose between its two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #   Package qemu-user-static is a virtual package provided by:
      #     qemu-user-binfmt-hwe 1:10.2.1+ds-1ubuntu4.4
      #     qemu-user-binfmt     1:10.2.1+ds-1ubuntu3.3
      #
      # `ubuntu-latest` migrated to Ubuntu 26 from 2026-10-19, so these three lanes
      # went red between a green main on 2026-10-23 and 2026-10-25 without anything
      # being committed.
      #
      # ⚠ Installing a provider is NOT the fix: they register binfmt handlers, they do
      # not ship the `qemu-<arch>-static` binaries this lane invokes. The lane would
      # then take its `command -v` branch and go GREEN while testing nothing — worse
      # than red. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that is
      # needed to run one Go test binary, so both names are installed and both are
      # looked for.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: test under qemu
        run: |
          arch="${{ matrix.goarch }}"
          # Go's GOARCH names mostly match qemu's user binary names; loong64 does not.
          name="$arch"
          [ "$arch" = loong64 ] && name=loongarch64
          q=""
          for cand in "qemu-${name}-static" "qemu-${name}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS the lane. It used to warn and exit 0, which is
          # a lane that reports success for an architecture it never ran — the one
          # outcome this matrix exists to rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for $arch (looked for qemu-${name}-static and qemu-${name})"
            exit 1
          fi
          echo "running $arch under $q"
          # ⛔ -timeout, because go test's default is 10 MINUTES PER PACKAGE and that
          # is a native-hardware figure: these lanes run the tests through an
          # interpreter. The engine package sat right against it and crossed on
          # ordinary runner variance — riscv64 took 6m06s on #645 and 11m19s on #648,
          # failing with `FAIL github.com/go-tex/engine 600.406s`, and a RE-RUN OF THE
          # SAME COMMIT then passed. The non-emulated lanes rule out a real slowdown:
          # ubuntu went 23m04s → 16m27s over those same two commits, faster.
          #
          # A lane that reds on variance teaches people to ignore reds, which costs
          # more than the lane is worth. The native job above already carries
          # `-timeout 30m` for the same reason on windows.
          GOARCH="$arch" go test -timeout 30m -exec="$q" ./...
  wasm:
    name: wasm (${{ matrix.goos }}/wasm)
    runs-on: ubuntu-latest
    strategy: { matrix: { goos: [js, wasip1] } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: GOOS=${{ matrix.goos }} GOARCH=wasm go build ./...
  fidelity:
    name: fidelity vs real LaTeX (tectonic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: install tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo install -m 0755 tectonic /usr/local/bin/tectonic
          tectonic --version
      - name: fidelity gate (gotex reproduces real LaTeX's prose)
        run: GOWORK=off ./scripts/fidelity.sh --check
