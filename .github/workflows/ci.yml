name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    name: test + conformance (${{ matrix.os }})
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.2' }
      - run: go vet ./...
      # ⛔ gofmt was not gated, and two files reached main unformatted: a trailing
      # comment duplicated onto a line it did not belong to, and doc-comment list
      # items that Go 1.27's gofmt separates with a blank //. Neither is visible to
      # `go vet`, and a local gofmt only sees them once the local toolchain has moved
      # — which is why "it is clean here" is not an answer. Reported as a diff so the
      # fix is in the log rather than only the failure.
      # ⛔ shell AND lane, both deliberate. A `run:` block's default shell is pwsh on
      # windows-latest, where this bash `if [ -n … ]` is a ParserError — the first
      # version of this gate failed on Windows alone and passed on the other two.
      # And formatting does not depend on the platform, so one lane is the right
      # number: three would be the same answer three times.
      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::these files are not gofmt'd:"; gofmt -l .
            gofmt -d .
            exit 1
          fi
      - run: go build ./...
      - name: test + conformance ratchet
        shell: bash
        run: |
          # -timeout, because the default is 10 minutes and windows-latest needs more
          # than that: the suite runs in ~40s locally with -race and over 600s on that
          # runner, which failed PRs at random with "panic: test timed out after 10m0s"
          # in whatever test happened to be running. No single test dominates (the
          # slowest is 7s, an expansion-limit guard) — the lane is simply that slow, so
          # the bound is raised rather than the suite trimmed. A real deadlock still
          # fails, three times later.
          go test -timeout 30m -race -coverprofile=cover.out ./...
          pct=$(go tool cover -func=cover.out | tail -1 | grep -oE '[0-9.]+' | tail -1)
          echo "coverage ${pct}% (in-progress engine; primary gate is the conformance ratchet in TestConformance)"
          awk "BEGIN{exit !(${pct} >= 80.0)}" || { echo "coverage ${pct}% below 80% floor"; exit 1; }
  arch:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # loong64 omitted: qemu user-mode support for it is unreliable on the runner
        # (the engine still cross-compiles for loong64; only the qemu run is dropped).
        goarch: [riscv64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.2' }
      # Bounded on purpose. On 2026-08-19 this step sat on an unreachable Ubuntu
      # mirror for over an hour, in several repositories at once, and the lane
      # reported "in progress" the whole time — a hung lane is indistinguishable
      # from a slow one, and the default job timeout is six hours. These lanes
      # normally finish in one to four minutes; ten turns an apt outage into a
      # failure that can be read and re-run.
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, and apt refuses to
      # choose between its two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #   Package qemu-user-static is a virtual package provided by:
      #     qemu-user-binfmt-hwe 1:10.2.1+ds-1ubuntu4.4
      #     qemu-user-binfmt     1:10.2.1+ds-1ubuntu3.3
      #
      # `ubuntu-latest` migrated to Ubuntu 26 from 2026-10-19, so these three lanes
      # went red between a green main on 2026-10-23 and 2026-10-25 without anything
      # being committed.
      #
      # ⚠ Installing a provider is NOT the fix: they register binfmt handlers, they do
      # not ship the `qemu-<arch>-static` binaries this lane invokes. The lane would
      # then take its `command -v` branch and go GREEN while testing nothing — worse
      # than red. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that is
      # needed to run one Go test binary, so both names are installed and both are
      # looked for.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: test under qemu
        run: |
          arch="${{ matrix.goarch }}"
          # Go's GOARCH names mostly match qemu's user binary names; loong64 does not.
          name="$arch"
          [ "$arch" = loong64 ] && name=loongarch64
          q=""
          for cand in "qemu-${name}-static" "qemu-${name}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS the lane. It used to warn and exit 0, which is
          # a lane that reports success for an architecture it never ran — the one
          # outcome this matrix exists to rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for $arch (looked for qemu-${name}-static and qemu-${name})"
            exit 1
          fi
          echo "running $arch under $q"
          GOARCH="$arch" go test -exec="$q" ./...
  wasm:
    name: wasm (${{ matrix.goos }}/wasm)
    runs-on: ubuntu-latest
    strategy: { matrix: { goos: [js, wasip1] } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.2' }
      - run: GOOS=${{ matrix.goos }} GOARCH=wasm go build ./...
  fidelity:
    name: fidelity vs real LaTeX (tectonic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.2' }
      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: install tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo install -m 0755 tectonic /usr/local/bin/tectonic
          tectonic --version
      - name: fidelity gate (gotex reproduces real LaTeX's prose)
        run: GOWORK=off ./scripts/fidelity.sh --check
